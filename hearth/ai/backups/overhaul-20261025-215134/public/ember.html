<!doctype html>
<html lang="en" class="ember-overlay is-dark" data-theme="dark" data-accent="white">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scorpi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300..800&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/glass.css">
<script>
  // same appearance as the main window
  try {
    const p = JSON.parse(localStorage.getItem('hearth.prefs') || '{}');
    const root = document.documentElement;
    if (p.accent) root.dataset.accent = p.accent;
    if (p.motion === 'reduced') root.dataset.motion = 'reduced';
  } catch (e) {}
</script>
</head>
<body>
<svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a3.8 3.8 0 005.4 0l3-3a3.8 3.8 0 00-5.4-5.4l-1 1M14 10a3.8 3.8 0 00-5.4 0l-3 3a3.8 3.8 0 005.4 5.4l1-1"/></symbol>
</svg>
<div id="ember"></div>
<script type="module" src="/js/ember.js"></script>
</body>
</html>
