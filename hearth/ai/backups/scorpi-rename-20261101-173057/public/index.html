<script>
  // keys saved while the app had its old name move to scorp.* once (prefs, sign-in token, studio, …)
  try {
    for (const store of [localStorage, sessionStorage]) {
      for (const key of Object.keys(store)) {
        if (!key.startsWith('hearth.')) continue;
        const next = 'scorp.' + key.slice(7);
        if (store.getItem(next) === null) store.setItem(next, store.getItem(key));
        store.removeItem(key);
      }
    }
  } catch (e) {}
  // Apply saved appearance before first paint.
  try {
    const p = JSON.parse(localStorage.getItem('scorp.prefs') || '{}');
    const root = document.documentElement;
    if (p.accent) root.dataset.accent = p.accent;
    if (p.textSize) root.dataset.text = p.textSize;
    root.dataset.motion = p.motion === 'reduced' ? 'reduced' : p.motion === 'system' ? 'system' : 'full';
    if (p.autoHideSidebar !== false) root.classList.add('auto-sidebar');
    if (p.hideStarters !== false) root.classList.add('no-starters');
    if (p.hideEmber) root.classList.add('no-ember');
    if (p.minimalComposer) root.classList.add('min-composer');
    if (localStorage.getItem('scorp.style') !== 'text') root.classList.add('style-visual');
    if (['left', 'right', 'top', 'bottom'].includes(p.sbDock)) root.dataset.sbDock = p.sbDock;
    if (p.sbWidth) root.style.setProperty('--sb', Math.min(480, Math.max(200, p.sbWidth)) + 'px');
    if (p.sbHeight) root.style.setProperty('--sbh', Math.max(170, p.sbHeight) + 'px');
    // the last active style, so a light style doesn't flash black while /api/looks loads (lib/looks.js keeps it)
    const look = JSON.parse(localStorage.getItem('scorp.look') || 'null');
    if (look && look.css) {
      const tag = document.createElement('style');
      tag.id = 'look-style';
      tag.textContent = look.css;
      document.head.appendChild(tag);
      root.dataset.look = look.id;
      root.dataset.scheme = root.dataset.theme = look.scheme;
      root.classList.toggle('is-dark', look.scheme !== 'light');
    }
  } catch (e) {}
</script>

<!-- shown while the app starts (it fades in after half a second, so a quick start never flashes it); main.js removes it.
     If a script cannot load or throws, it says so instead of leaving a blank page. -->
<style>
  #boot { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 24px; text-align: center; background: var(--bg, #000); color: var(--ink-2, #bbb); font: 14px/1.5 var(--font-ui, system-ui, sans-serif); opacity: 0; animation: boot-in .4s .5s forwards; }
  #boot.fail { color: var(--ink, #fff); }
  #boot .boot-msg { max-width: 420px; }
  #boot button { margin-top: 16px; padding: 10px 22px; border-radius: 999px; border: 1px solid currentColor; background: transparent; color: inherit; font: inherit; cursor: pointer; }
  #boot.fail .boot-msg { color: var(--danger, #ff8a8a); }
  @keyframes boot-in { to { opacity: 1; } }
</style>
<div id="boot" role="status" aria-live="polite"><div class="boot-msg"><div id="bootMsg">Starting Scorp…</div><button id="bootRetry" type="button" hidden onclick="try{sessionStorage.removeItem('scorp.boot')}catch(x){};location.reload()">Try again</button></div></div>
<script>
  (function () {
    var boot = document.getElementById('boot'), msg = document.getElementById('bootMsg');
    function show(text, fail) {
      if (!boot.isConnected) return; // the app has started
      boot.style.animation = 'none'; // a message is shown at once, not after the fade-in
      boot.style.opacity = 1;
      msg.textContent = text;
      boot.classList.toggle('fail', !!fail);
    }
    // only what stops the app from starting counts: a script that will not load or throws. A stylesheet, icon or preload that
    // fails, or a background request that is refused, does not.
    addEventListener('error', function (e) {
      var t = e.target;
      if (t && t !== window && t.tagName !== 'SCRIPT') return;
      var file = ((t && t.src) || e.filename || '').replace(location.origin, '');
      var detail = (e.message || 'could not load ' + file) + (e.message && file ? ' (' + file + ')' : '');
      // a file that fails to arrive is usually a hiccup on the connection: try again by itself, twice, before giving up
      var tries = 0;
      try { tries = +sessionStorage.getItem('scorp.boot') || 0; } catch (x) {}
      if (!e.message && tries < 2) {
        try { sessionStorage.setItem('scorp.boot', tries + 1); } catch (x) {}
        show('Starting Scorp… (trying again)');
        return setTimeout(function () { location.reload(); }, 800);
      }
      show('Scorp could not start: ' + detail + '.', true);
      document.getElementById('bootRetry').hidden = false;
    }, true);
    setTimeout(function () { show('Still starting. The connection is slow; if this stays, reload the page.'); }, 7000);
  })();
</script>
