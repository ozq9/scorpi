<!doctype html>
<html lang="en" class="companion" data-mode="talk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scorpi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300..800;1,400&display=swap">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/companion.css">
<script>
  // keys saved while the app had its old name move to scorpi.* once (prefs, sign-in token, studio, …)
  try {
    for (const store of [localStorage, sessionStorage]) {
      for (const key of Object.keys(store)) {
        const old = ['scorp.', 'hearth.'].find((p) => key.startsWith(p));
        if (!old) continue;
        const next = 'scorpi.' + key.slice(old.length);
        if (store.getItem(next) === null) store.setItem(next, store.getItem(key));
        store.removeItem(key);
      }
    }
  } catch (e) {}
  // same appearance as the main window
  try {
    const p = JSON.parse(localStorage.getItem('scorpi.prefs') || '{}');
    const root = document.documentElement;
    if (p.accent) root.dataset.accent = p.accent;
    root.dataset.motion = p.motion === 'reduced' ? 'reduced' : 'full';
    const look = JSON.parse(localStorage.getItem('scorpi.look') || 'null');
    if (look && look.css) {
      const tag = document.createElement('style');
      tag.id = 'look-style';
      tag.textContent = look.css;
      document.head.appendChild(tag);
      root.dataset.scheme = root.dataset.theme = look.scheme;
    }
  } catch (e) {}
</script>
</head>
<body>
